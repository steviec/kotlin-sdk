# This branch maintains compatibility with Kotlin 1.8.22
# Changes from main:
# - Kotlin version: 2.1.20 -> 1.8.22
# - Binary compatibility validator: latest -> 0.13.2
# - Ktor version: latest -> 2.3.6 (matching Maestro)
# - Other dependency versions adjusted for 1.8.22 compatibility

[versions]
# plugins version
kotlin = "1.8.22"
dokka = "2.0.0"

# libraries version
serialization = "[1.5.0,)"  # Any version >= 1.5.0
coroutines = "[1.7.0,)"    # Any version >= 1.7.0
ktor = "2.3.6"             # Match Maestro's version exactly
mockk = "[1.13.0,)"        # Any version >= 1.13.0
logging = "[7.0.0,)"       # Any version >= 7.0.0
jreleaser = "1.17.0"
binaryCompatibilityValidatorPlugin = "0.13.2"
slf4j = "[2.0.0,)"         # Any version >= 2.0.0
kotest = "[5.9.0,)"        # Any version >= 5.9.0
kotlinx-io = "[0.1.16,)"   # Any version >= 0.1.16 for Kotlin 1.8.22

[libraries]
# Kotlinx libraries
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-io = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io" }

# Ktor libraries
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }

# Logging
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "logging" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

# Testing
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
kotlinx-binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidatorPlugin" }
